# Render Instagram carousel slides on a GitHub runner.
#
# The generator downloads set and minifig pictures from img.bricklink.com,
# which some machines (locked-down networks, CI sandboxes) cannot reach.
# A GitHub-hosted runner can, so this workflow renders the payload here,
# uploads the PNGs as an artifact and commits them under carousel/out/<set>/
# on the branch it ran from.
name: Render carousel

on:
  push:
    paths:
      - "carousel/**"
      - "!carousel/out/**"
      - ".github/workflows/carousel.yml"
  workflow_dispatch:
    inputs:
      payload:
        description: "Payload JSON to render (empty = every file in carousel/samples/)"
        default: ""
        required: false
      sort:
        description: "Minifig order: none (as in payload) or value (most valuable first)"
        default: "none"
        type: choice
        options: [none, value]
      commit:
        description: "Commit the rendered slides back to this branch"
        default: true
        type: boolean

concurrency:
  group: carousel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PAYLOAD: ${{ inputs.payload }}
      SORT: ${{ inputs.sort || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: carousel/requirements.txt

      - name: Install
        run: |
          pip install -r carousel/requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: Test
        run: python -m pytest carousel/tests -q

      - name: Render (every theme)
        run: |
          shopt -s nullglob
          payloads=("$PAYLOAD"); [ -z "$PAYLOAD" ] && payloads=(carousel/samples/*.json)
          themes=$(python -c "from carousel import generate as g; print(' '.join(g.THEMES))")
          for p in "${payloads[@]}"; do
            for theme in $themes; do
              python -m carousel.generate "$p" --sort "$SORT" --theme "$theme"
            done
          done

      - name: Upload slides
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides
          path: carousel/out/
          retention-days: 30

      - name: Commit slides
        if: ${{ github.event_name == 'push' || inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carousel/out
          git diff --staged --quiet && { echo "slides unchanged"; exit 0; }
          git commit -m "Render carousel slides for ${PAYLOAD:+$(basename "$PAYLOAD" .json)}${PAYLOAD:-all samples}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
