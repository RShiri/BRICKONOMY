name: pages-check

# Verifies that the published GitHub Pages site is actually reachable.
# It runs on a GitHub runner, which can reach rshiri.github.io — handy when
# whoever is debugging cannot. Nothing is deployed here; this only reads.
#
# Pinned to the "branch main, folder /docs" Pages setting, where docs/ IS the
# site root: the export's index.html answers "/" and there is no "/docs/" URL
# at all. The previous version expected both "/" and "/docs/" to succeed,
# which no single Pages configuration can satisfy — serving from /docs makes
# "/docs/" a 404, serving from the root makes the export unreachable.
# The repo-root index.html redirect only matters in the root configuration
# and is not published in this one.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "index.html"
      - ".nojekyll"
      - ".github/workflows/pages-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the published site
        env:
          BASE: https://rshiri.github.io/BRICKONOMY
        run: |
          set -u
          # Pages can take a minute to publish after a push.
          sleep 45

          declare -A EXPECT=(
            ["/"]="200"
            ["/sets/75192.html"]="200"
            ["/minifigs.html"]="200"
            ["/api/index.json"]="200"
            ["/static/style.css"]="200"
          )
          ORDER=("/" "/sets/75192.html" "/minifigs.html" "/api/index.json" "/static/style.css")

          echo "## Pages check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | status | expected | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          failures=0
          for path in "${ORDER[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}${path}" || echo "000")
            want="${EXPECT[$path]}"
            if [[ " $want " == *" $code "* ]]; then
              mark="✅"
            else
              mark="❌"
              failures=$((failures + 1))
            fi
            echo "| \`${path}\` | $code | $want | $mark |" >> "$GITHUB_STEP_SUMMARY"
            echo "${mark} ${path} -> ${code} (expected ${want})"
          done

          # Show what the landing page actually serves, so a Jekyll-mangled or
          # placeholder page is obvious in the log rather than just "200".
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "First bytes of ${BASE}/ :" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -s --max-time 30 "${BASE}/" | head -c 400 >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -gt 0 ]; then
            echo "::error::${failures} Pages URL(s) did not return the expected status"
            exit 1
          fi
          echo "All Pages URLs reachable."
